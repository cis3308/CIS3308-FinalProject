
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="src/BudgetStyle.css" />
    <title>Budget</title>
  </head>

  <body>
    <div>
        <header>
            <nav>
                <img src="" alt="logo" />
                <a href="#">
                    My Budget
                </a>
                <a href="#">
                    Split
                </a>
                <div class="profile">
                    <a>Profile</a>
                </div>
            </nav>
        </header>
    </div>

    <div class="budget-page">
        <div class="pie-chart">
            <div class="title">
                <h1>January</h1>
            </div>
            <div id="pie-chart-container"></div>

            <a href="src/setBudgetPage.html">
                <button id="set-budget">Set Budget</button>
            </a>
        </div>

        <div class="budget">
            <div class="title">
                <h2>Budget</h2>
            </div>
            <div class="budget-list">
                <div class="budget-buttons">
                    <button id="add">+ add category</button>
                    <button id="edit">Edit</button>
                </div>
                <div class="income">
                    income
                </div>
                <div class="expense" id="expense-list">
                    <svg width="10" height="10"></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="category-popup-container" class="hidden">
    <div class="category-popup">
        <div class="popup-content">
            <button id="cancel">x</button>
            <h2>Add Category</h2>
            <label for="category-name">Category Name</label>
            <input id="category-name" type="text">
            <label for="category-limit">Budget Amount</label>
            <input id="category-limit" type="number">
            <button id="add-new">Add</button>
        </div>
    </div>
    </div>


    <script type="module" src="src/pageFunction.ts"></script>
  </body>
</html>
