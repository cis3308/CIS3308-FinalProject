
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget</title>
    <script type="module" crossorigin src="/CIS3308-FinalProject/assets/supabaseClient-mJ8uqkb-.js"></script>
    <script type="module" crossorigin src="/CIS3308-FinalProject/assets/pageFunction-BQKq8Z3a.js"></script>

  </head>

  <body>
    <div>
        <header>
            <nav>
                <img src="" alt="logo" />
                <a href="#">
                    My Budget
                </a>
                <a href="#">
                    Split
                </a>
                <div class="profile">
                    <a>Profile</a>
                </div>
            </nav>
        </header>
    </div>

    <div class="budget-page">
        <div class="pie-chart">
            <div class="title">
                <h1>January</h1>
            </div>
            <div id="pieChart">
                <svg width="200" height="200">

                </svg>
            </div>
            <div class="date-range">
                <label for="range">Select Budget Range:</label>
                <select id="month-start">
                    <option value="" disabled selected>-- Select a Month --</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
                <span>to</span>
                <select id="month-finish">
                    <option value="" disabled selected>-- Select a Month --</option>
                    <option value="01">January</option>
                    <option value="02">February</option>
                    <option value="03">March</option>
                    <option value="04">April</option>
                    <option value="05">May</option>
                    <option value="06">June</option>
                    <option value="07">July</option>
                    <option value="08">August</option>
                    <option value="09">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
        </div>

        <div class="budget">
            <div class="title">
                <h2>Budget</h2>
            </div>
            <div class="budget-list">
                <div class="income-budget">
                    <div class="income">
                        income
                    </div>
                    <div class="income-button">
                        <button id="add">+</button>
                    </div>
                </div>
                <div class="expense">
                    <div class="expense-category">
                        <div class="top">
                            <svg width="10" height="10"></svg>
                            <span>Food</span>
                            <input type="number" id="category-budget" name="category-budget" placeholder="Enter your budget">
                        </div>
                    </div>

                    <div class="budget-button">
                        <button id="add">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="save">
        <button id="save-budget">save</button>
    </div>


  </body>
</html>
